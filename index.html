<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="L.A.B.L">
<meta name="theme-color" content="#1C1C1C">
<title>L.A.B.L · 8-Week Program</title>
<style>
  :root{
    --aqua:#D6FFFA; --pink:#F2E3EF; --gray:#CDCECA;
    --bg:#1C1C1C; --surface:#242424; --surface2:#2E2E2E; --surface3:#383838;
    --ink:#F2F2F0; --sub:#A6A8A4; --line:#333333; --dark:#111312;
    /* legacy var mapping (JS references) */
    --navy:var(--aqua); --slate:var(--surface2); --green:var(--aqua);
    --blue:var(--pink); --purple:var(--aqua); --orange:var(--pink);
    --gold:var(--aqua); --link:var(--aqua); --card:var(--surface);
    --deload:#2A2226;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }
  /* ---------- header ---------- */
  header{
    background:linear-gradient(180deg,#232523 0%, var(--bg) 100%);
    color:#fff; position:sticky; top:0; z-index:50;
    padding:calc(14px + env(safe-area-inset-top)) 16px 0 16px;
  }
  header h1{font-size:26px; font-weight:800; letter-spacing:.06em; line-height:1.05}
  header h1 i{color:var(--aqua); font-style:normal}
  header .sub{font-size:11.5px; color:var(--sub); margin:3px 0 12px; letter-spacing:.02em}
  .weekbar{display:flex; gap:6px; overflow-x:auto; padding-bottom:12px; scrollbar-width:none}
  .weekbar::-webkit-scrollbar{display:none}
  .wk{
    flex:0 0 auto; min-width:46px; text-align:center; padding:7px 9px; border-radius:999px;
    background:var(--surface2); color:var(--gray); font-size:12px; font-weight:700;
    border:1.5px solid transparent; transition:background .15s,color .15s;
  }
  .wk small{display:block; font-size:9px; font-weight:600; opacity:.7}
  .wk.active{background:var(--aqua); color:var(--dark)}
  .wk.active small{opacity:.85}
  .wk.deload{background:#332B31; color:var(--pink)}
  .wk.deload.active{background:var(--pink); color:var(--dark)}
  .weeknote{
    background:var(--surface); color:var(--gray); font-size:11.5px; padding:8px 16px 8px 13px;
    position:sticky; z-index:49; border-left:3px solid var(--aqua);
  }
  .weeknote b{color:#fff}
  /* ---------- layout ---------- */
  main{padding:14px 14px 26px}
  .card{
    background:var(--surface); border:none; border-radius:16px;
    margin-bottom:12px; overflow:hidden;
  }
  .accent{height:3px}
  .card .pad{padding:14px 15px}
  .exname{font-size:16px; font-weight:700; letter-spacing:.01em}
  .exname a{color:var(--acc,var(--aqua)); text-decoration:none}
  .exname a::after{content:" ▸"; font-size:12px; opacity:.7}
  .muscle{font-size:11.5px; color:var(--sub); margin-top:2px}
  .chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:10px}
  .chip{
    background:var(--surface2); border-radius:10px; padding:5px 11px; font-size:12.5px;
    font-weight:700; color:var(--ink);
  }
  .chip span{font-weight:600; color:var(--sub); font-size:10px; display:block; line-height:1.15;
    text-transform:uppercase; letter-spacing:.05em}
  .chip.rest{background:var(--acc-soft,rgba(214,255,250,.12)); color:var(--acc,var(--aqua))}
  .chip.rest span{color:var(--acc-dim,rgba(214,255,250,.65))}
  .chip.rest:active{background:var(--acc-soft,rgba(214,255,250,.25))}
  .notes{
    font-size:12.5px; color:var(--gray); margin-top:10px; background:#202220;
    border-left:3px solid var(--acc,var(--aqua)); padding:9px 11px; border-radius:0 10px 10px 0;
    display:none;
  }
  .card.open .notes{display:block}
  .notestoggle{font-size:11.5px; color:var(--acc,var(--aqua)); font-weight:700; margin-top:9px; display:inline-block}
  /* ---------- logging ---------- */
  .logrow{display:flex; gap:8px; margin-top:11px}
  .logrow input{
    font-size:14px; padding:9px 11px; border:1.5px solid var(--surface3); border-radius:10px;
    background:var(--surface2); color:var(--ink); width:100%; font-family:inherit;
  }
  .logrow input::placeholder{color:#6E706C}
  .logrow input:focus{outline:none; border-color:var(--acc,var(--aqua)); background:#333533}
  .logrow .load{flex:1.1}
  .logrow .set{flex:1.6}
  .loglabel{font-size:10.5px; color:var(--sub); font-weight:700; margin-top:10px;
    text-transform:uppercase; letter-spacing:.07em}
  .prev{font-size:11px; color:#82847F; margin-top:6px}
  .prev b{color:var(--gray)}
  /* ---------- banners ---------- */
  .banner{
    color:var(--dark); border-radius:14px; padding:13px 15px; font-size:14px; font-weight:800;
    margin-bottom:12px; letter-spacing:.01em;
  }
  .banner small{display:block; font-weight:600; font-size:11.5px; opacity:.75; margin-top:3px; line-height:1.4}
  .sect{font-size:11px; font-weight:800; color:var(--sub); text-transform:uppercase;
    letter-spacing:.09em; margin:18px 2px 9px}
  /* ---------- day picker ---------- */
  .daypick{display:flex; gap:6px; margin-bottom:13px}
  .daypick button{
    flex:1; padding:10px 0 8px; border-radius:12px; border:none;
    background:var(--surface); font-family:inherit; font-size:13px; font-weight:800; color:var(--sub);
    transition:background .15s,color .15s;
  }
  .daypick button small{display:block; font-size:9px; font-weight:700; letter-spacing:.03em; opacity:.8}
  .daypick button.on{color:var(--dark)}
  /* ---------- bottom nav ---------- */
  nav{
    position:fixed; bottom:0; left:0; right:0; z-index:60;
    background:rgba(24,25,24,.97); backdrop-filter:blur(14px);
    border-top:1px solid #2A2A2A; display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; background:none; border:none; font-family:inherit; padding:9px 0 7px;
    font-size:10px; font-weight:700; color:#767873; letter-spacing:.03em;
  }
  nav button svg{display:block; margin:0 auto 3px; width:22px; height:22px; stroke:currentColor; fill:none;
    stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  nav button.on{color:var(--aqua)}
  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:12.5px}
  th{background:var(--surface2); color:var(--gray); text-align:left; padding:8px 9px; font-size:10.5px;
    text-transform:uppercase; letter-spacing:.06em}
  td{padding:9px; border-bottom:1px solid var(--line); vertical-align:top; color:var(--ink)}
  tr.dl td{background:rgba(242,227,239,.07)}
  tr.nowwk td{background:rgba(214,255,250,.08)}
  /* ---------- rest timer widget ---------- */
  #timer{
    position:fixed; left:14px; right:14px; bottom:calc(72px + env(safe-area-inset-bottom));
    background:var(--surface2); color:#fff; border-radius:16px; padding:13px 17px; z-index:70;
    display:none; align-items:center; gap:14px; box-shadow:0 8px 28px rgba(0,0,0,.55);
  }
  #timer.show{display:flex}
  #timer .t{font-size:27px; font-weight:800; font-variant-numeric:tabular-nums; flex:1}
  #timer button{
    background:var(--surface3); color:#fff; border:none; border-radius:10px; padding:9px 14px;
    font-family:inherit; font-size:13px; font-weight:800;
  }
  #timer.done{background:var(--aqua); color:var(--dark)}
  #timer.done button{background:rgba(17,19,18,.15); color:var(--dark)}
  /* ---------- interval timer ---------- */
  .seg{display:flex; background:var(--surface2); border-radius:12px; padding:3px; gap:3px}
  .seg button{flex:1; border:none; background:none; font-family:inherit; padding:9px 0;
    border-radius:10px; font-size:13px; font-weight:800; color:var(--sub)}
  .seg button.on{background:var(--aqua); color:var(--dark)}
  .itfield{flex:1}
  .itfield label{display:block; font-size:10px; font-weight:800; color:var(--sub);
    text-transform:uppercase; letter-spacing:.06em; margin-bottom:5px}
  .itfield input{width:100%; font-size:18px; font-weight:800; padding:11px; text-align:center;
    border:1.5px solid var(--surface3); border-radius:12px; background:var(--surface2);
    font-family:inherit; color:var(--ink)}
  .itfield input:focus{outline:none; border-color:var(--aqua); background:#333533}
  .presets{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px}
  .presets button{border:1.5px solid var(--surface3); background:var(--surface); border-radius:999px;
    padding:8px 12px; font-family:inherit; font-size:11.5px; font-weight:800; color:var(--gray)}
  .presets button:active{border-color:var(--aqua); color:var(--aqua)}
  .bigbtn{width:100%; border:none; border-radius:999px; padding:16px 0; font-family:inherit;
    font-size:16px; font-weight:800; color:var(--dark); margin-top:14px; letter-spacing:.02em}
  #itdisplay{border-radius:20px; padding:30px 18px 22px; text-align:center; color:var(--dark);
    transition:background .3s}
  #itdisplay .phase{font-size:13px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; opacity:.75}
  #itdisplay .clock{font-size:72px; font-weight:800; font-variant-numeric:tabular-nums; line-height:1.05}
  #itdisplay .meta{font-size:13px; font-weight:700; opacity:.75; margin-top:5px}
  #itdisplay .bar{height:6px; background:rgba(17,19,18,.18); border-radius:3px; margin-top:16px; overflow:hidden}
  #itdisplay .bar div{height:100%; background:var(--dark); border-radius:3px; transition:width .5s linear}
  .itbtns{display:flex; gap:8px; margin-top:14px}
  .itbtns button{flex:1; border:none; border-radius:999px; padding:14px 0; font-family:inherit;
    font-size:14px; font-weight:800; color:#fff}
  .guide p{font-size:13px; margin-bottom:11px; color:var(--gray)}
  .guide b{color:#fff}
  .lib a{color:var(--aqua); text-decoration:none; font-weight:700}
  .lib .cue{font-size:11.5px; color:var(--sub); margin-top:1px}
  .footer{font-size:10.5px; color:#6E706C; text-align:center; margin-top:20px; line-height:1.65}
</style>
</head>
<body>

<header>
  <h1>L<i>.</i>A<i>.</i>B<i>.</i>L</h1>
  <div class="sub">8-WEEK STRENGTH + CARDIO&nbsp;&nbsp;·&nbsp;&nbsp;CARBON PERFORMANCE</div>
  <div class="weekbar" id="weekbar"></div>
</header>
<div class="weeknote" id="weeknote"></div>

<main id="main"></main>

<div id="timer">
  <div class="t" id="timertxt">0:00</div>
  <button onclick="Timer.add(15)">+15s</button>
  <button onclick="Timer.stop()">✕</button>
</div>

<nav id="nav">
  <button data-v="workout" class="on"><svg viewBox="0 0 24 24"><path d="M2 12h2M20 12h2M6 12h12"/><rect x="4" y="7" width="3" height="10" rx="1"/><rect x="17" y="7" width="3" height="10" rx="1"/></svg>Workout</button>
  <button data-v="cardio"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-9-9c-1.2-2.8.6-6 3.8-6C9 5 10.8 6.6 12 8.2 13.2 6.6 15 5 17.2 5c3.2 0 5 3.2 3.8 6-2 4.5-9 9-9 9z"/><path d="M5 12h4l1.5-3 2 6 1.5-3h4"/></svg>Cardio</button>
  <button data-v="itimer"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13V9M10 2h4M12 2v3"/></svg>Timer</button>
  <button data-v="guide"><svg viewBox="0 0 24 24"><path d="M12 6c-2-1.5-5-2-8-2v14c3 0 6 .5 8 2 2-1.5 5-2 8-2V4c-3 0-6 .5-8 2z"/><path d="M12 6v14"/></svg>Guide</button>
  <button data-v="library"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5.5 3.5-5.5 3.5z"/></svg>Videos</button>
</nav>

<script>
/* ================= DATA ================= */
const LINKS = {
 "Linear Hack Squat":"https://www.youtube.com/watch?v=fE5BWPy7uRc",

 "BB Tutorials":"https://www.youtube.com/playlist?list=PLWPdd5JiYYwCgeBPq0ZOV25IXc8_4Sw29"
};

const WEEKS = [
 {n:1, tag:"Base",  cls:"", note:"<b>Week 1 — Baseline.</b> Find working weights, learn the machines. Last set ≈ 2–3 reps in the tank (RIR 2–3). Log your machine settings!"},
 {n:2, tag:"Build", cls:"", note:"<b>Week 2 — Build.</b> Add the smallest jump on any lift where you hit the rep target. RIR 2."},
 {n:3, tag:"Build", cls:"", note:"<b>Week 3 — Build.</b> +1 increment where you hit target reps. Missed reps? Repeat the weight — never trade tempo for load. RIR 1–2."},
 {n:4, tag:"Hard",  cls:"", note:"<b>Week 4 — Overload.</b> +1 increment. Hardest week of Block 1 — sets should feel tough. RIR 1."},
 {n:5, tag:"DELOAD",cls:"deload", note:"<b>Week 5 — DELOAD.</b> ~60% of Week-4 loads AND one set fewer per exercise. Cardio = easy Zone 2 only. RIR 4–5. This is where growth cashes in."},
 {n:6, tag:"Rebuild",cls:"", note:"<b>Week 6 — Rebuild.</b> Return to ~Week 3–4 loads. Should feel strong and fresh. RIR 2."},
 {n:7, tag:"Build", cls:"", note:"<b>Week 7 — Build.</b> +1 increment. RIR 1–2."},
 {n:8, tag:"Peak",  cls:"", note:"<b>Week 8 — Peak.</b> +1 increment; leave nothing on the final sets. RIR 0–1. Then retest & rebuild with new variations."}
];

const DAYS = [
 {id:"d1", short:"Lower A", label:"Quads", color:"var(--green)",
  title:"Day 1 · Lower A — Quad-Dominant",
  time:"60 min · ~40 lift + 20 cardio",
  warm:"Warm-up (~5 min): easy bike/elliptical + leg swings, 10 bodyweight squats, then 1–2 light ramp sets on the Hack Squat.",
  cardio:"20 min intervals after lifting — see Cardio tab.",
  ex:[
   {n:"Linear Hack Squat", link:"Linear Hack Squat", m:"Quads", s:"4×8", t:"3-1-1", r:150,
    note:"Primary quad builder. Feet low & shoulder-width to bias quads. Control to just below parallel, brief pause, drive through mid-foot."},
   {n:"Leg Press", link:"Leg Press", m:"Quads / Glutes", s:"3×10", t:"2-0-1", r:120,
    note:"Lower foot placement = more quad. Knees toward chest to ~90°+ without the low back rounding. Don't slam lockout — keep tension."},
   {n:"Leg Extension", link:"Leg Extension", m:"Quads (isolation)", s:"3×15", t:"2-1-2", r:75,
    note:"Pause & squeeze 1s at the top, slow 2s negative. Teardrop/VMO builder. Light & high-rep — chase the burn, don't ego-load."},
   {n:"Prone Leg Curl", link:"Lying Leg Curl", m:"Hamstrings", s:"3×12", t:"3-0-1", r:75,
    note:"Face-down on the pad, hips PINNED the whole set. Balances the quad work, protects the knees. Full squeeze at the top, 3s controlled lower, no bouncing."},
   {n:"Standing Abductor", link:"Standing Abductor", m:"Glute medius", s:"3×20", t:"2-1-1", r:60,
    note:"Slight forward hip lean, push the knee out & slightly back, pause at end range. Builds the upper-glute shelf."},
   {n:"Abs: GHD Sit-ups + GHD Trunk Twists", link:"GHD Sit-up", m:"Abs / obliques", s:"3× (10 + 10/side)", t:"2-0-1", r:60,
    note:"Superset on the GHD, rest 60s between rounds. Sit-ups: start with MODEST range (torso to parallel) and bodyweight — GHD sit-ups bite harder than they look; add range, then a plate, over the weeks. Twists: arms out, rotate under control. Twist video is in the Videos tab."}
  ]},
 {id:"d2", short:"Upper A", label:"Push+Pull", color:"var(--blue)",
  title:"Day 2 · Upper A — Push & Pull (free weights)",
  time:"60 min · ~40 lift + 20 cardio",
  warm:"Warm-up (~5 min): arm circles, 20 band pull-aparts, shoulder dislocates, then 1–2 empty-bar ramp sets on the Push Press.",
  cardio:"20 min intervals after lifting — see Cardio tab.",
  ex:[
   {n:"BB Push Press", link:"BB Push Press", m:"Shoulders / Tri / Full body", s:"4×8", t:"3-0-X", r:150,
    note:"Primary press. Small knee dip, then DRIVE through the legs and punch the bar overhead — the leg drive lets you overload beyond a strict press. Lower under control (3s). ALTERNATE weeks with the Seated DB Arnold Press (4×10, rotate palms from facing you to facing forward) — its video is in the Videos tab. Log whichever you did."},
   {n:"Tall-Kneeling Landmine Press", link:"Landmine Press", m:"Shoulders / Upper chest / Core", s:"3×10/side", t:"2-0-1", r:90,
    note:"Both knees down, glutes squeezed — the tall-kneeling position forces the core to do the stabilizing. Press the bar up-and-forward along its arc. (Half-kneeling or standing are fine variations.)"},
   {n:"Banded Pull-ups", link:"Banded Pull-up", m:"Lats / Upper back", s:"3×6–10", t:"3-1-1", r:120,
    note:"Band on the bar, knee or foot in. Full dead-hang stretch, chest to the bar, 3s controlled lower. Thinner band over time = built-in progression. (Lat pulldowns live on Day 4 — a different vertical pull each upper day.)"},
   {n:"Seated Cable Row", link:"Seated Cable Row", m:"Mid-back / Lats", s:"3×10", t:"2-1-1", r:90,
    note:"Tall chest, drive the elbows back, pause and pinch the blades, control the return. No torso rocking — small lean is fine, momentum isn't."},
   {n:"Abs: Kipping Knees-to-Elbows (K2E) — wave loading", link:"Kipping K2E", m:"Abs / lats / grip", s:"2×(10-8-6)", t:"—", r:90,
    note:"WAVE LOADING: one set = a descending wave with just 10s between drops — 10 reps · rest 10s · 8 reps · rest 10s · 6 reps. Do 2 waves total, ~90s between waves. Build the wave over the program: Wk1–2 = 10-8-6, Wk3–4 = 11-9-7, Wk5 deload = one easy wave, Wk6 = 12-10-8, Wk7 = 13-11-9, Wk8 = 14-12-10. Rhythmic kip (hollow → arch), knees UP to the elbows — let the kip do the lifting. Scale: knees to chest until the swing is smooth."}
  ]},
 {id:"d3", short:"Lower B", label:"Glutes", color:"var(--green)",
  title:"Day 3 · Lower B — Glute / Hip-Dominant (free weights)",
  time:"60 min · ~40 lift + 20 cardio",
  warm:"Warm-up (~5 min): easy StairMaster/bike, 15 bodyweight glute bridges, leg swings, then ramp sets on the Hip Thrust and an empty-bar RDL set.",

/* ================= STORAGE (localStorage w/ in-memory fallback) ================= */
const Store = (()=>{
  let mem = {};
  let ok = false;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok = true; } catch(e){ ok = false; }
  return {
    get:k=>{ try{ return ok ? localStorage.getItem(k) : (mem[k] ?? null); }catch(e){ return mem[k] ?? null; } },
    set:(k,v)=>{ try{ if(ok){ localStorage.setItem(k,v); } }catch(e){} mem[k]=v; },
    persistent: ok
  };
})();

/* ================= TIMER ================= */
const Timer = (()=>{
  let left=0, iv=null;
  const el=()=>document.getElementById("timer");
  const txt=()=>document.getElementById("timertxt");
  function render(){
    const m=Math.floor(left/60), s=left%60;
    txt().textContent = m+":"+String(s).padStart(2,"0");
  }
  function tick(){
    left--;
    if(left<=0){ left=0; clearInterval(iv); iv=null; el().classList.add("done");
      txt().textContent="Rest done — go!";
      try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
      setTimeout(()=>{ el().classList.remove("show","done"); }, 2500);
      return;
    }
    render();
  }
  return {
    start(sec){ left=sec; el().classList.remove("done"); el().classList.add("show"); render();
      if(iv) clearInterval(iv); iv=setInterval(tick,1000); },
    add(sec){ left+=sec; render(); },
    stop(){ if(iv) clearInterval(iv); iv=null; el().classList.remove("show","done"); }
  };
})();

const IT = {
  running:false, paused:false, phase:"idle", // warmup | work | rest | done
  left:0, round:1, totalLeft:0, iv:null, cfg:null, wakeLock:null, actx:null
};
function itGet(k,d){ const v=Store.get("la.it."+k); return v===null?d:v; }
function itSet(k,v){ Store.set("la.it."+k, String(v)); }

function itBeep(pattern){ // pattern: array of [freqHz, ms] with 80ms gaps
  try{
    if(!IT.actx) IT.actx = new (window.AudioContext||window.webkitAudioContext)();
    const ctx = IT.actx; if(ctx.state==="suspended") ctx.resume();
    let t = ctx.currentTime;
    pattern.forEach(([f,ms])=>{
      const o=ctx.createOscillator(), g=ctx.createGain();
      o.type="sine"; o.frequency.value=f; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.5,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t+ms/1000);
      o.start(t); o.stop(t+ms/1000+0.05); t += ms/1000 + 0.08;
    });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(pattern.map(p=>p[1])); }catch(e){}
}
async function itWake(on){
  try{
    if(on && "wakeLock" in navigator){ IT.wakeLock = await navigator.wakeLock.request("screen"); }
    else if(IT.wakeLock){ IT.wakeLock.release(); IT.wakeLock=null; }
  }catch(e){}
}

  const g=id=>document.getElementById(id);
  const work = Math.max(5, parseInt(g("it-work").value)||45);
  const rest = Math.max(0, parseInt(g("it-rest").value)||45);
  const mode = IT.mode||"rounds";
  const rounds = Math.max(1, parseInt(g("it-rounds") ? g("it-rounds").value : 10)||10);
  const mins = Math.max(1, parseInt(g("it-mins") ? g("it-mins").value : 18)||18);
  const warm = g("it-warm").checked;
  itSet("work",work); itSet("rest",rest); itSet("mode",mode);
  itSet("rounds",rounds); itSet("mins",mins); itSet("warm",warm?1:0);
  const cycle = work+rest;
  const totalSec = mode==="rounds" ? rounds*cycle : mins*60;
  const estRounds = mode==="rounds" ? rounds : Math.max(1, Math.ceil(mins*60/cycle));
  return {work, rest, mode, rounds:estRounds, warm, warmSec: warm?120:0, totalSec};
}
function itStart(){
  const cfg = itReadCfg();
  IT.cfg=cfg; IT.running=true; IT.paused=false; IT.round=1;
  IT.totalLeft = cfg.totalSec + cfg.warmSec;
  if(cfg.warm){ IT.phase="warmup"; IT.left=cfg.warmSec; }
  else { IT.phase="work"; IT.left=cfg.work; }
  itBeep([[880,150],[880,150]]);
  itWake(true);
  if(IT.iv) clearInterval(IT.iv);
  IT.iv = setInterval(itTick, 1000);
  renderMain();
}
function itTick(){
  if(IT.paused) return;
  IT.left--; IT.totalLeft--;
  const c=IT.cfg;
  // countdown pips for last 3s of any phase
  if(IT.left<=3 && IT.left>0 && IT.phase!=="done") itBeep([[660,90]]);
  if(IT.totalLeft<=0){ itFinish(); return; }
  if(IT.left<=0){
    if(IT.phase==="warmup"){ IT.phase="work"; IT.left=c.work; itBeep([[880,150],[1100,220]]); }
    else if(IT.phase==="work"){
      if(c.rest>0){ IT.phase="rest"; IT.left=c.rest; itBeep([[520,300]]); }
      else { IT.round++; IT.left=c.work; itBeep([[880,150],[1100,220]]); }
    }
    else if(IT.phase==="rest"){
      if(c.mode==="rounds" && IT.round>=c.rounds){ itFinish(); return; }
      IT.round++; IT.phase="work"; IT.left=c.work; itBeep([[880,150],[1100,220]]);
    }
  }
  itPaint();
}
function itFinish(){
  IT.phase="done"; IT.running=false;
  clearInterval(IT.iv); IT.iv=null;
  itBeep([[880,180],[1100,180],[1320,400]]);
  itWake(false);
  itPaint();
}
function itStop(){
  IT.running=false; IT.phase="idle";
  if(IT.iv) clearInterval(IT.iv); IT.iv=null;
  itWake(false);
  renderMain();
}
function itPauseToggle(){
  IT.paused=!IT.paused;
  const b=document.getElementById("it-pause");
  if(b) b.textContent = IT.paused ? "Resume" : "Pause";
  itPaint();
}
function itFmt(s){ s=Math.max(0,s); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
const IT_COLORS = {warmup:"#CDCECA", work:"#D6FFFA", rest:"#F2E3EF", done:"#D6FFFA"};
const IT_LABELS = {warmup:"Warm-up · easy", work:"WORK — push", rest:"Rest — easy", done:"Done — cool down easy 1–2 min"};
function itPaint(){
  const d=document.getElementById("itdisplay"); if(!d) return;
  d.style.background = IT_COLORS[IT.phase] || "#33415C";
  const c=IT.cfg||{};
  d.querySelector(".phase").textContent = IT_LABELS[IT.phase] || "";
  d.querySelector(".clock").textContent = IT.phase==="done" ? "🎉" : itFmt(IT.left);
  d.querySelector(".meta").textContent = IT.phase==="done"
    ? `Finished — ${c.rounds||""} rounds of ${c.work}s / ${c.rest}s`
    : (IT.phase==="warmup" ? `Intervals start after warm-up · total left ${itFmt(IT.totalLeft)}`
       : `Round ${IT.round}${c.rounds?" / "+c.rounds:""} · total left ${itFmt(IT.totalLeft)}`);
  const total=(c.totalSec||0)+(c.warmSec||0);
  const frac= total? (1 - IT.totalLeft/total) : 0;
  d.querySelector(".bar div").style.width = Math.min(100, Math.max(0, frac*100))+"%";
}
function itMode(m){ IT.mode=m; itSet("mode",m); renderMain(); }
function itPreset(w,r,n){
  IT.mode="rounds"; itSet("mode","rounds");
  itSet("work",w); itSet("rest",r); itSet("rounds",n);
  renderMain();
}
function itimerHTML(){
  IT.mode = IT.mode || itGet("mode","rounds");
  if(IT.running || IT.phase==="done"){
    // running / finished screen
    setTimeout(itPaint, 0);
    return `
    <div id="itdisplay">
      <div class="phase"></div>
      <div class="clock"></div>
      <div class="meta"></div>
      <div class="bar"><div></div></div>
    </div>
    <div class="itbtns">
      ${IT.running?`<button id="it-pause" style="background:var(--slate)" onclick="itPauseToggle()">${IT.paused?"Resume":"Pause"}</button>`:""}
      <button style="background:${IT.running?"#3A2A2E;color:#F0B9C9":"var(--aqua);color:var(--dark)"}" onclick="itStop()">${IT.running?"End":"New timer"}</button>
    </div>
    <div class="footer">Keep the phone awake &amp; volume up — beeps mark every switch.<br>3 pips = phase about to change · high double-beep = WORK · low beep = rest.</div>`;
  }
  const mode=IT.mode;
  const work=itGet("work",45), rest=itGet("rest",45), rounds=itGet("rounds",10), mins=itGet("mins",18), warm=itGet("warm","1")==="1";
  return `
  <div class="banner" style="background:var(--orange)">Interval Timer<small>Set your work / rest and go — beeps &amp; buzzes mark every switch, so no staring at the clock mid-sprint.</small></div>
  <div class="card"><div class="pad">
    <div class="loglabel" style="margin-top:0">This week's protocol (one tap)</div>
    <div class="presets">
      <button onclick="itPreset(45,45,10)">Wk1–2 · 45/45 ×10</button>
      <button onclick="itPreset(30,30,15)">Wk3–4 · 30/30 ×15</button>
      <button onclick="itPreset(120,60,5)">Wk6–7 · 2min/1min ×5</button>
    </div>
    <div class="loglabel">Work &amp; rest (this is your ratio)</div>
    <div class="logrow">
      <div class="itfield"><label>Work (sec)</label><input id="it-work" type="number" inputmode="numeric" min="5" value="${work}"></div>
      <div class="itfield"><label>Rest (sec)</label><input id="it-rest" type="number" inputmode="numeric" min="0" value="${rest}"></div>
    </div>
    <div class="loglabel">Run it by…</div>
    <div class="seg">
      <button class="${mode==='rounds'?'on':''}" onclick="itMode('rounds')">Rounds</button>
      <button class="${mode==='time'?'on':''}" onclick="itMode('time')">Total minutes</button>
    </div>
    <div class="logrow">
      ${mode==='rounds'
        ? `<div class="itfield"><label>Rounds</label><input id="it-rounds" type="number" inputmode="numeric" min="1" value="${rounds}"></div>`
        : `<div class="itfield"><label>Total minutes</label><input id="it-mins" type="number" inputmode="numeric" min="1" value="${mins}"></div>`}
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:600;color:var(--slate)">
      <input id="it-warm" type="checkbox" ${warm?"checked":""} style="width:18px;height:18px"> Start with 2-min easy warm-up
    </label>
    <button class="bigbtn" style="background:var(--green)" onclick="itStart()">▶ Start</button>
  </div></div>
  <div class="footer">Rounds mode: work+rest × rounds (45/45 ×10 ≈ 15 min).<br>Total-minutes mode: cycles work/rest until time runs out.<br>Settings are remembered for next time.</div>`;
}

function renderMain(){
  const v = {workout:workoutHTML, cardio:cardioHTML, itimer:itimerHTML, guide:guideHTML, library:libraryHTML}[view];
  $("main").innerHTML = v();
}

renderWeekbar();
renderMain();
</script>
</body>
