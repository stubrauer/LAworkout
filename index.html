<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LA Program">
<meta name="theme-color" content="#1F2A44">
<title>Leighann · 8-Week Program</title>
<style>
  :root{
    --navy:#1F2A44; --slate:#33415C; --green:#1E7A5A; --blue:#2E5E8C;
    --purple:#5B4B8A; --orange:#C8622A; --gold:#B8860B;
    --bg:#F4F5F7; --card:#FFFFFF; --ink:#1C2430; --sub:#5B6472;
    --line:#E3E7EC; --link:#1155CC; --deload:#FBEDD8;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.45;
    padding-bottom:calc(64px + env(safe-area-inset-bottom));
  }
  /* ---------- header ---------- */
  header{
    background:var(--navy); color:#fff; position:sticky; top:0; z-index:50;
    padding:calc(10px + env(safe-area-inset-top)) 14px 0 14px;
  }
  header h1{font-size:16px; font-weight:700; letter-spacing:.02em}
  header .sub{font-size:11.5px; color:#B9C2D4; margin:2px 0 8px}
  .weekbar{display:flex; gap:5px; overflow-x:auto; padding-bottom:10px; scrollbar-width:none}
  .weekbar::-webkit-scrollbar{display:none}
  .wk{
    flex:0 0 auto; min-width:44px; text-align:center; padding:6px 8px; border-radius:10px;
    background:#2C3A5C; color:#C7D0E2; font-size:12px; font-weight:600; border:1.5px solid transparent;
  }
  .wk small{display:block; font-size:9px; font-weight:500; opacity:.75}
  .wk.active{background:#fff; color:var(--navy); border-color:#fff}
  .wk.deload{background:#7A5A2E; color:#FFE9C9}
  .wk.deload.active{background:var(--deload); color:#7A4A12; border-color:var(--deload)}
  .weeknote{
    background:var(--slate); color:#DDE3EE; font-size:11.5px; padding:7px 14px;
    position:sticky; z-index:49;
  }
  .weeknote b{color:#fff}
  /* ---------- layout ---------- */
  main{padding:12px 12px 24px}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    margin-bottom:10px; overflow:hidden;
  }
  .accent{height:4px}
  .card .pad{padding:12px 13px}
  .exname{font-size:15.5px; font-weight:700}
  .exname a{color:var(--link); text-decoration:none; border-bottom:1.5px dotted var(--link)}
  .muscle{font-size:11.5px; color:var(--sub); margin-top:1px}
  .chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
  .chip{
    background:#EEF1F5; border-radius:8px; padding:4px 9px; font-size:12px; font-weight:600;
  }
  .chip span{font-weight:500; color:var(--sub); font-size:10.5px; display:block; line-height:1.1}
  .chip.rest{background:#FBEDE2; color:#8A4416}
  .chip.rest:active{background:#F5D9C4}
  .notes{
    font-size:12.5px; color:#3D4654; margin-top:9px; background:#F7F8FA;
    border-left:3px solid var(--line); padding:8px 10px; border-radius:0 8px 8px 0;
    display:none;
  }
  .card.open .notes{display:block}
  .notestoggle{font-size:11.5px; color:var(--link); font-weight:600; margin-top:8px; display:inline-block}
  /* ---------- logging ---------- */
  .logrow{display:flex; gap:7px; margin-top:10px}
  .logrow input{
    font-size:14px; padding:8px 10px; border:1.5px solid var(--line); border-radius:9px;
    background:#FBFCFD; color:var(--ink); width:100%; font-family:inherit;
  }
  .logrow input:focus{outline:none; border-color:var(--blue); background:#fff}
  .logrow .load{flex:1.1}
  .logrow .set{flex:1.6}
  .loglabel{font-size:10.5px; color:var(--sub); font-weight:600; margin-top:8px;
    text-transform:uppercase; letter-spacing:.04em}
  .prev{font-size:11px; color:#7A8494; margin-top:5px}
  .prev b{color:#455063}
  /* ---------- section headers / banners ---------- */
  .banner{
    color:#fff; border-radius:12px; padding:11px 13px; font-size:13px; font-weight:600;
    margin-bottom:10px;
  }
  .banner small{display:block; font-weight:400; font-size:11.5px; opacity:.9; margin-top:2px}
  .sect{font-size:12px; font-weight:700; color:var(--sub); text-transform:uppercase;
    letter-spacing:.06em; margin:16px 2px 8px}
  /* ---------- day picker ---------- */
  .daypick{display:flex; gap:6px; margin-bottom:12px}
  .daypick button{
    flex:1; padding:9px 0 7px; border-radius:11px; border:1.5px solid var(--line);
    background:#fff; font-family:inherit; font-size:13px; font-weight:700; color:var(--sub);
  }
  .daypick button small{display:block; font-size:9px; font-weight:600; letter-spacing:.02em}
  .daypick button.on{color:#fff; border-color:transparent}
  /* ---------- bottom nav ---------- */
  nav{
    position:fixed; bottom:0; left:0; right:0; z-index:60;
    background:rgba(255,255,255,.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--line); display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav button{
    flex:1; background:none; border:none; font-family:inherit; padding:8px 0 6px;
    font-size:10.5px; font-weight:600; color:#8B93A2;
  }
  nav button .ico{font-size:19px; display:block; line-height:1.25}
  nav button.on{color:var(--navy)}
  /* ---------- tables ---------- */
  table{width:100%; border-collapse:collapse; font-size:12.5px}
  th{background:var(--slate); color:#fff; text-align:left; padding:7px 8px; font-size:11px}
  td{padding:8px; border-bottom:1px solid var(--line); vertical-align:top}
  tr.dl td{background:var(--deload)}
  tr.nowwk td{background:#EAF1EA}
  /* ---------- timer ---------- */
  #timer{
    position:fixed; left:12px; right:12px; bottom:calc(70px + env(safe-area-inset-bottom));
    background:var(--navy); color:#fff; border-radius:14px; padding:12px 16px; z-index:70;
    display:none; align-items:center; gap:14px; box-shadow:0 6px 24px rgba(15,23,42,.35);
  }
  #timer.show{display:flex}
  #timer .t{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; flex:1}
  #timer button{
    background:#3A4A70; color:#fff; border:none; border-radius:9px; padding:8px 13px;
    font-family:inherit; font-size:13px; font-weight:700;
  }
  #timer.done{background:var(--green)}
  .guide p{font-size:13px; margin-bottom:10px; color:#2A3341}
  .guide b{color:var(--ink)}
  .lib a{color:var(--link); text-decoration:none; font-weight:600}
  .lib .cue{font-size:11.5px; color:var(--sub)}
  .footer{font-size:10.5px; color:#98A0AE; text-align:center; margin-top:18px; line-height:1.6}
</style>
</head>
<body>

<header>
  <h1>LEIGHANN · 8-WEEK PROGRAM</h1>
  <div class="sub">Carbon Performance · 5 days/wk · lifting + intervals</div>
  <div class="weekbar" id="weekbar"></div>
</header>
<div class="weeknote" id="weeknote"></div>

<main id="main"></main>

<div id="timer">
  <div class="t" id="timertxt">0:00</div>
  <button onclick="Timer.add(15)">+15s</button>
  <button onclick="Timer.stop()">✕</button>
</div>

<nav id="nav">
  <button data-v="workout" class="on"><span class="ico">🏋️</span>Workout</button>
  <button data-v="cardio"><span class="ico">🫀</span>Cardio</button>
  <button data-v="guide"><span class="ico">📖</span>Guide</button>
  <button data-v="library"><span class="ico">🎥</span>Machines</button>
</nav>

<script>

 ["ISO Flat Chest Press","Chest","Handles mid-chest, full stretch, no flare."],
 ["ISO Incline Press","Upper chest","Controlled press, don't over-flare."],
 ["Vertical Chest Press","Chest","Full stretch; balances pull days."],
 ["ISO Shoulder Press","Shoulders","Ribs down; stop short of lockout."],
 ["Viking Press","Shoulders","Neutral grip — shoulder-friendly."],
 ["ISO Lat Pulldown","Lats","Elbows down to hips, tall chest."],
 ["Vertical Row","Lats/Upper back","Lead with elbows, full stretch, no swing."],
 ["ISO Multi Row","Mid-back","Chest supported; pinch the blades."],
 ["Lever Row","Lats/Mid-back","Neutral grip, squeeze & control."],
 ["T-Bar Row","Mid-back","Chest on pad; elbows to hips, pause."]
];

/* ================= STORAGE (localStorage w/ in-memory fallback) ================= */
const Store = (()=>{
  let mem = {};
  let ok = false;
  try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); ok = true; } catch(e){ ok = false; }
  return {
    get:k=>{ try{ return ok ? localStorage.getItem(k) : (mem[k] ?? null); }catch(e){ return mem[k] ?? null; } },
    set:(k,v)=>{ try{ if(ok){ localStorage.setItem(k,v); } }catch(e){} mem[k]=v; },
    persistent: ok
  };
})();

/* ================= STATE ================= */
let week = parseInt(Store.get("la.week") || "1", 10);
let day  = Store.get("la.day") || "d1";
let view = "workout";

/* ================= TIMER ================= */
const Timer = (()=>{
  let left=0, iv=null;
  const el=()=>document.getElementById("timer");
  const txt=()=>document.getElementById("timertxt");
  function render(){
    const m=Math.floor(left/60), s=left%60;
    txt().textContent = m+":"+String(s).padStart(2,"0");
  }
  function tick(){
    left--;
    if(left<=0){ left=0; clearInterval(iv); iv=null; el().classList.add("done");
      txt().textContent="Rest done — go!";
      try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
      setTimeout(()=>{ el().classList.remove("show","done"); }, 2500);
      return;
    }
    render();
  }
  return {
    start(sec){ left=sec; el().classList.remove("done"); el().classList.add("show"); render();
      if(iv) clearInterval(iv); iv=setInterval(tick,1000); },
    add(sec){ left+=sec; render(); },
    stop(){ if(iv) clearInterval(iv); iv=null; el().classList.remove("show","done"); }
  };
})();

/* ================= RENDER ================= */
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function renderWeekbar(){
  $("weekbar").innerHTML = WEEKS.map(w=>
    `<div class="wk ${w.cls} ${w.n===week?'active':''}" onclick="setWeek(${w.n})">W${w.n}<small>${w.tag}</small></div>`
  ).join("");
  $("weeknote").innerHTML = WEEKS[week-1].note;
}
function setWeek(n){ week=n; Store.set("la.week",String(n)); renderWeekbar(); renderMain(); }
function setDay(id){ day=id; Store.set("la.day",id); renderMain(); }
function setView(v){
  view=v;
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  renderMain();
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>b.addEventListener("click",()=>setView(b.dataset.v)));

function keyFor(dId, exIdx, wk){ return `la.log.${dId}.${exIdx}.w${wk}`; }
function setKeyFor(dId, exIdx){ return `la.set.${dId}.${exIdx}`; }

function saveLog(dId, exIdx, val){ Store.set(keyFor(dId,exIdx,week), val); refreshPrev(dId, exIdx); }
function saveSettings(dId, exIdx, val){ Store.set(setKeyFor(dId,exIdx), val); }

function prevText(dId, exIdx){
  const parts=[];
  for(let w=1; w<=8; w++){
    const v=Store.get(keyFor(dId,exIdx,w));
    if(v && w!==week) parts.push(`W${w}: <b>${esc(v)}</b>`);
  }
  return parts.length ? "History — "+parts.join(" · ") : "";
}
function refreshPrev(dId, exIdx){
  const el=document.getElementById(`prev-${dId}-${exIdx}`);
  if(el) el.innerHTML = prevText(dId, exIdx);
}

function workoutHTML(){
  const d = DAYS.find(x=>x.id===day);
  const isDeload = week===5;
  let h = `<div class="daypick">` + DAYS.map((x,ix)=>
    `<button class="${x.id===day?'on':''}" style="${x.id===day?`background:${x.color}`:''}" onclick="setDay('${x.id}')">D${ix+1}<small>${x.label}</small></button>`
  ).join("") + `</div>`;

  h += `<div class="banner" style="background:${d.color}">${d.title}<small>${d.time}</small></div>`;
  h += `<div class="card"><div class="pad" style="font-size:12.5px;color:var(--sub)">🔥 ${d.warm}</div></div>`;
  if(isDeload) h += `<div class="card" style="background:var(--deload);border-color:#EED9B8"><div class="pad" style="font-size:12.5px;color:#7A4A12"><b>Deload week:</b> ~60% of Week-4 loads and drop one set per exercise. Easy does it — on purpose.</div></div>`;

  d.ex.forEach((e,i)=>{
    const link = e.link ? `<a href="${LINKS[e.link]}" target="_blank" rel="noopener">${esc(e.n)}</a>` : esc(e.n);
    const logVal = Store.get(keyFor(d.id,i,week)) || "";
    const setVal = Store.get(setKeyFor(d.id,i)) || "";
    const sets = isDeload ? e.s.replace(/^(\d)/, m=>String(Math.max(1,parseInt(m)-1))) : e.s;
    h += `
    <div class="card" id="card-${d.id}-${i}">
      <div class="accent" style="background:${d.color}"></div>
      <div class="pad">
        <div class="exname">${i+1}. ${link}</div>
        <div class="muscle">${esc(e.m)}</div>
        <div class="chips">
          <div class="chip"><span>sets × reps</span>${sets}${isDeload&&sets!==e.s?' <small style="color:#B0691E">(deload)</small>':''}</div>
          <div class="chip"><span>tempo</span>${e.t}</div>
          <div class="chip rest" onclick="Timer.start(${e.r})"><span>rest — tap ⏱</span>${e.r>=120?(e.r/60)+" min":e.r+"s"}</div>
        </div>
        <span class="notestoggle" onclick="document.getElementById('card-${d.id}-${i}').classList.toggle('open')">Coaching notes ▾</span>
        <div class="notes">${esc(e.note)}</div>
        <div class="loglabel">Week ${week} log</div>
        <div class="logrow">
          <input class="load" inputmode="text" placeholder="e.g. 95×8" value="${esc(logVal)}"
            onchange="saveLog('${d.id}',${i},this.value)">
          <input class="set" placeholder="machine settings (seat 4 · feet low…)" value="${esc(setVal)}"
            onchange="saveSettings('${d.id}',${i},this.value)">
        </div>
        <div class="prev" id="prev-${d.id}-${i}">${prevText(d.id,i)}</div>
      </div>
    </div>`;
  });

  h += `<div class="banner" style="background:var(--orange)">▶ ${d.cardio}</div>`;
  if(!Store.persistent){
    h += `<div class="footer">⚠️ This browser is blocking saved data — logs will reset when the page closes. Open the file in Safari (not a preview) for logging to stick.</div>`;
  }
  h += `<div class="footer">Tap an exercise name for machine media · tap the rest chip to start the timer<br>Logs save on this device only.</div>`;
  return h;
}

function cardioHTML(){
  let h = `<div class="banner" style="background:var(--orange)">Cardio Intervals — 20 min after lifting<small>You pick the machine, the program picks the intervals. 2 min easy warm-up → intervals → 1–2 min cool-down. Day 5 = ~15 min easy Zone 2 instead.</small></div>`;
  h += `<div class="card"><table><tr><th>Wks</th><th>Protocol</th><th>RPE</th></tr>`;
  CARDIO.forEach(c=>{
    const now = c.wks.includes(week);
    h += `<tr class="${c.dl?'dl':''} ${now?'nowwk':''}"><td>${c.w}${now?' ◀':''}</td><td><b>${c.name}</b><br>${c.det}</td><td>${c.rpe}</td></tr>`;
  });
  h += `</table></div>`;
  h += `<div class="sect">RPE key</div><div class="card"><div class="pad" style="font-size:12.5px">
    <b>3–4</b> easy — full conversation (recovery bits & warm-up)<br>
    <b>5–6</b> Zone 2 — can talk in sentences (deload week)<br>
    <b>7</b> hard — short phrases only<br>
    <b>8–9</b> very hard — a word or two; you want the rest to arrive</div></div>`;
  h += `<div class="sect">Machine cues — make "hard" actually hard</div>`;
  MACHCUES.forEach(m=>{
    h += `<div class="card"><div class="pad"><b>${m[0]}</b><div style="font-size:12.5px;margin-top:3px">${m[1]}<br><span style="color:var(--sub)">${m[2]}</span></div></div></div>`;
  });
  return h;
}

function guideHTML(){
  return `<div class="banner" style="background:var(--gold)">The "why" — read once, revisit when tweaking</div>
  <div class="card guide"><div class="pad">
  <p><b>Volume is the dose.</b> Muscle grows on ~10–20 hard sets per muscle weekly — more isn't better past that, it just costs recovery. This program: quads ≈14–18, glutes ≈12–16, hams ≈9–12, abs ≈9–12.</p>
  <p><b>Effort is the trigger.</b> The last ~5 reps before failure drive most growth — that's what RIR (reps in reserve) controls. Machines are the safest place to push close to failure.</p>
  <p><b>Progressive overload is the engine.</b> Add the smallest increment whenever you hit the rep target with clean tempo & full range. Stall? Repeat the weight — normal, not failure.</p>
  <p><b>Range of motion,</b> especially the deep stretch position, beats heavy half-reps for growth. Real depth, controlled stretch.</p>
  <p><b>Recovery is where growth happens.</b> Protein ≈ 0.7–1 g/lb daily, 7–9 h sleep, and honor the Week-5 deload. Sharp joint pain = back off; muscle burn = the point.</p>
  <p><b>Cardio goes after lifting</b> so it never steals strength, and drops to easy Zone 2 on the deload.</p>
  <p><b>Order your week</b> so two lower days don't stack back-to-back. Ideal: L · U · L · U · L(long Sat). Running/solidcore slot on off-days or after easy days.</p>
  <p><b>Reading the prescription:</b> Tempo 3-1-1 = 3s down · 1s pause · 1s up. Rest chips are tappable timers. Warm-up sets don't count toward the listed sets.</p>
  </div></div>`;
}

function libraryHTML(){
  let h = `<div class="banner" style="background:var(--navy)">Machine Library<small>Every machine → cue + tap for full media</small></div>`;
  h += `<div class="card"><div class="pad lib"><a href="${LINKS["Tutorials"]}" target="_blank" rel="noopener">▶ Arsenal Strength video tutorials (YouTube)</a><div class="cue">Official how-to playlist — great first stop for any new machine.</div></div></div>`;
  LIB.forEach(m=>{
    const url = LINKS[m[0]];
    h += `<div class="card"><div class="pad lib">${url?`<a href="${url}" target="_blank" rel="noopener">${m[0]}</a>`:`<b>${m[0]}</b>`} <span style="font-size:11px;color:var(--sub)">· ${m[1]}</span><div class="cue">${m[2]}</div></div></div>`;
  });
  return h;
}

function renderMain(){
  const v = {workout:workoutHTML, cardio:cardioHTML, guide:guideHTML, library:libraryHTML}[view];
  $("main").innerHTML = v();
}

renderWeekbar();
renderMain();
</script>
